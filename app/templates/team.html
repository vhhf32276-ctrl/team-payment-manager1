{% extends "base.html" %}

{% block title %}Team{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Team Members</h1>
        <p>Shared access ke liye team members add karein.</p>
    </div>
</div>

<div class="form-box">

    <h2>Add Team Member</h2>

    <form method="POST">

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Team username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >

        <button type="submit">
            Add Member
        </button>

    </form>

</div>

<div class="table-box">

    <h2>Team List</h2>

    <div class="table-wrap">
        <table>

            <thead>
                <tr>
                    <th>Username</th>
                    <th>Role</th>
                </tr>
            </thead>

            <tbody>

            {% for user in users %}

                <tr>
                    <td>{{ user["username"] }}</td>
                    <td>{{ user["role"] }}</td>
                </tr>

            {% endfor %}

            </tbody>

        </table>
    </div>

</div>

{% endblock %}
